name: Prepare signed fork release

# Run manually on an existing version tag. Produces a draft, never a published release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'yeli19950109/Strata' && github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      FORK_TAURI_PUBLIC_KEY: ${{ vars.FORK_TAURI_PUBLIC_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check fork key, tag and signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY secret'; exit 1; }
          python apps/desktop/scripts/fork-release.py overlay --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/fork-tauri.json"
      - name: Install UI and Tauri dependencies
        shell: bash
        run: |
          npm ci --prefix apps/host --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Find browser for UI test
        shell: pwsh
        run: |
          $browser = @("${env:ProgramFiles}\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chrome or Edge is required for the browser test' }
          "STRATA_TEST_CHROME=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run full client tests and typecheck
        working-directory: apps/host
        run: npm test && npm run typecheck
      - name: Check release and external engine safety
        run: python -m unittest tests.terminal.test_fork_release tests.terminal.test_external_engine_update -q
      - name: Stage verified Node runtime (Windows)
        shell: pwsh
        run: |
          ./apps/desktop/scripts/fetch-node.ps1
          ./apps/desktop/scripts/fetch-node.ps1 -Check
      - name: Stage Control and Python
        run: python apps/desktop/scripts/stage-control.py && python apps/desktop/scripts/stage-control.py --check
      - name: Prepare optional empty resources
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/harness apps/desktop/src-tauri/resources/engine-bundle
          printf 'Optional Harness is not included.\n' > apps/desktop/src-tauri/resources/harness/NOT-INCLUDED.txt
          printf 'No engine is included.\n' > apps/desktop/src-tauri/resources/engine-bundle/NOT-INCLUDED.txt
      - name: Build UI
        working-directory: apps/desktop
        run: npm run build:ui
      - name: Build signed updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        shell: bash
        run: |
          npx tauri build --config "$RUNNER_TEMP/fork-tauri.json" --bundles 'nsis'
      - name: Verify signature and stage platform metadata
        shell: bash
        run: |
          python apps/desktop/scripts/fork-release.py collect --tag "$RELEASE_TAG" --target 'windows-x86_64' --bundle apps/desktop/src-tauri/target/release/bundle --output "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release-windows-x86_64
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: windows-latest
    environment: fork-release
    permissions:
      contents: write
    env:
      FORK_TAURI_PUBLIC_KEY: ${{ vars.FORK_TAURI_PUBLIC_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-release-*
          path: staged
      - name: Combine and reverify every updater artifact
        run: |
          python apps/desktop/scripts/fork-release-merge.py --tag "$env:RELEASE_TAG" --input staged --output release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python apps/desktop/scripts/fork-release.py verify --tag "$env:RELEASE_TAG" --output release
      - name: Create draft release
        run: gh release create "$env:RELEASE_TAG" --verify-tag --draft --title "$env:RELEASE_TAG" --notes "Draft fork release. Verify Windows signing before publishing." (Get-ChildItem release -File | ForEach-Object { $_.FullName })
