name: Desktop client

# Fork CI: no engine or model is built, downloaded, signed or published here.
on:
  push:
    paths:
      - 'app/host/**'
      - 'app/desktop/**'
      - 'terminal/**'
      - 'engine/metal/tools/**'
      - 'engine/third_party/strata-gguf-py/**'
      - 'tools/packaging/**'
      - 'docs/MANAGEMENT_PROTOCOL.md'
      - 'docs/TERMINAL_LAUNCH.md'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/fork-release.yml'
  pull_request:
    paths:
      - 'app/host/**'
      - 'app/desktop/**'
      - 'terminal/**'
      - 'engine/metal/tools/**'
      - 'engine/third_party/strata-gguf-py/**'
      - 'tools/packaging/**'
      - 'docs/MANAGEMENT_PROTOCOL.md'
      - 'docs/TERMINAL_LAUNCH.md'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/fork-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: UI types, tests and build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          architecture: x64
          cache: npm
          cache-dependency-path: app/host/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: npm ci --no-audit --no-fund
        working-directory: app/host
      - run: npm run typecheck
        working-directory: app/host
      - name: Chosen engine folder tests (stdlib only)
        # Temporary folders only; no real engine or GPU.
        run: python -m unittest tests.terminal.test_engine_dir_choice tests.terminal.test_fork_cfg_paths -q
        working-directory: terminal
      - name: Fork release configuration tests
        run: python -m unittest tests.terminal.test_fork_release -q
        working-directory: terminal
      - name: Find browser for UI test
        shell: pwsh
        run: |
          $browser = @("${env:ProgramFiles}\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chrome or Edge is required for the browser test' }
          "STRATA_TEST_CHROME=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Host tests (complete suite)
        working-directory: app/host
        run: npm test
      - run: npm run build
        working-directory: app/host

  package:
    needs: host
    name: Desktop package / Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - name: Install UI and Tauri dependencies
        shell: bash
        run: |
          npm ci --prefix app/host --no-audit --no-fund
          npm ci --prefix app/desktop --no-audit --no-fund
      - name: Stage verified Node runtime (Windows)
        shell: pwsh
        run: |
          ./app/desktop/scripts/fetch-node.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./app/desktop/scripts/fetch-node.ps1 -Check
      - name: Stage Control and Python runtime
        run: python app/desktop/scripts/stage-control.py && python app/desktop/scripts/stage-control.py --check
      - name: Prepare explicitly empty optional resources
        shell: bash
        run: |
          mkdir -p app/desktop/src-tauri/resources/harness app/desktop/src-tauri/resources/engine-bundle
          printf 'CI package: optional Harness is not included.\n' > app/desktop/src-tauri/resources/harness/CI-NOT-INCLUDED.txt
          printf 'CI package: no engine is included.\n' > app/desktop/src-tauri/resources/engine-bundle/CI-NOT-INCLUDED.txt
      - name: Build unsigned test package
        working-directory: app/desktop
        run: npm run build:ui && npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: strata-desktop-test-windows-x64
          path: app/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
