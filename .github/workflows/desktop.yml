name: Desktop client

# Fork CI: no engine or model is built, downloaded, signed or published here.
on:
  push:
    paths:
      - 'apps/host/**'
      - 'apps/desktop/**'
      - 'strata_control/**'
      - 'strata_cli/**'
      - 'serve/**'
      - 'tools/**'
      - 'setup.py'
      - 'strata.py'
      - 'ref/load.py'
      - 'data/**'
      - 'bench/prompts/standard-v1/**'
      - 'docs/MANAGEMENT_PROTOCOL.md'
      - 'docs/TERMINAL_LAUNCH.md'
      - 'packaging/package_terminal.py'
      - 'packaging/package_engine.py'
      - 'packaging/feed_tool.py'
      - 'packaging/binary_deps.py'
      - 'tests/terminal/test_engine_dir_choice.py'
      - 'tests/terminal/test_fork_release.py'
      - 'tests/terminal/update_fixture.py'
      - 'packaging/locks/**'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/fork-release.yml'
  pull_request:
    paths:
      - 'apps/host/**'
      - 'apps/desktop/**'
      - 'strata_control/**'
      - 'strata_cli/**'
      - 'serve/**'
      - 'tools/**'
      - 'setup.py'
      - 'strata.py'
      - 'ref/load.py'
      - 'data/**'
      - 'bench/prompts/standard-v1/**'
      - 'docs/MANAGEMENT_PROTOCOL.md'
      - 'docs/TERMINAL_LAUNCH.md'
      - 'packaging/package_terminal.py'
      - 'packaging/package_engine.py'
      - 'packaging/feed_tool.py'
      - 'packaging/binary_deps.py'
      - 'tests/terminal/test_engine_dir_choice.py'
      - 'tests/terminal/test_fork_release.py'
      - 'tests/terminal/update_fixture.py'
      - 'packaging/locks/**'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/fork-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: UI types, tests and build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        working-directory: apps/host
      - run: npm run typecheck
        working-directory: apps/host
      - name: Chosen engine folder tests (stdlib only)
        # Temporary folders only; no real engine or GPU.
        run: python -m unittest tests.terminal.test_engine_dir_choice -q
      - name: Fork release configuration tests
        run: python -m unittest tests.terminal.test_fork_release -q
      - name: Find browser for UI test
        shell: pwsh
        run: |
          $browser = @("${env:ProgramFiles}\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chrome or Edge is required for the browser test' }
          "STRATA_TEST_CHROME=$browser" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Host tests (complete suite)
        working-directory: apps/host
        run: npm test
      - run: npm run build
        working-directory: apps/host

  package:
    needs: host
    name: Desktop package / Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install UI and Tauri dependencies
        shell: bash
        run: |
          npm ci --prefix apps/host --no-audit --no-fund
          npm ci --prefix apps/desktop --no-audit --no-fund
      - name: Stage verified Node runtime (Windows)
        shell: pwsh
        run: |
          ./apps/desktop/scripts/fetch-node.ps1
          ./apps/desktop/scripts/fetch-node.ps1 -Check
      - name: Stage Control and Python runtime
        run: |
          python apps/desktop/scripts/stage-control.py
          python apps/desktop/scripts/stage-control.py --check
      - name: Prepare explicitly empty optional resources
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/harness apps/desktop/src-tauri/resources/engine-bundle
          printf 'CI package: optional Harness is not included.\n' > apps/desktop/src-tauri/resources/harness/CI-NOT-INCLUDED.txt
          printf 'CI package: no engine is included.\n' > apps/desktop/src-tauri/resources/engine-bundle/CI-NOT-INCLUDED.txt
      - name: Build unsigned test package
        working-directory: apps/desktop
        run: npm run build:ui && npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: strata-desktop-test-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
