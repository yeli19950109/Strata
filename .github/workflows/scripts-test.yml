name: Scripts test

# Fork: the issue-intake scripts are not part of desktop CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/item-check.test.js
